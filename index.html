<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tidsmaskinen Pro - Final Touch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');

        :root {
            --bg: #0b0f1a;
            --card: #161e2d;
            --primary: #38bdf8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; margin: 0; overflow: hidden;
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        #game-container {
            background: var(--card);
            width: 100%; height: 100%; max-width: 500px;
            display: flex; flex-direction: column; position: relative;
            overflow: hidden;
        }

        .game-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); flex-shrink: 0; }
        .stats-container { display: flex; gap: 12px; font-weight: 700; color: #94a3b8; font-size: 0.8rem; }
        
        #play-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; min-height: 0; }
        #word-area { display: flex; flex-direction: column; align-items: center; width: 100%; }
        #word-display { font-size: 2.4rem; font-weight: 800; margin: 5px 0; color: #fff; text-align: center; }
        #tense-tag { background: var(--primary); color: #000; padding: 3px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
        
        #user-input { 
            width: 85%; padding: 8px; font-size: 1.6rem; border: none; 
            border-bottom: 3px solid var(--primary); background: transparent; 
            color: #fff; text-align: center; margin: 15px 0; outline: none;
            height: 3.5rem;
        }
        
        #user-input.wrong-feedback { border-bottom-color: var(--danger); color: var(--danger); }
        #user-input.correct-blink { border-bottom-color: var(--success); color: var(--success); }

        .keyboard { 
            background: rgba(0,0,0,0.6); 
            padding: 10px 8px calc(45px + env(safe-area-inset-bottom)); 
            display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
            border-top: 2px solid rgba(56, 189, 248, 0.2);
        }
        .kb-row { display: flex; justify-content: center; gap: 4px; width: 100%; }
        .key { 
            background: #2d3748; color: #fff; flex: 1; height: 48px; 
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem;
            box-shadow: 0 3px 0 #1a202c; user-select: none;
        }
        .key:active { transform: translateY(2px); box-shadow: none; background: var(--primary); color: #000; }
        .key.del { background: #4a5568; flex: 1.5; }
        .key.enter { background: var(--accent); flex: 1.8; }
        .key.space { flex: 4; background: #334155; height: 50px; margin-top: 5px; }

        #main-menu, #modal-overlay {
            position: absolute; inset: 0; z-index: 100;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }
        
        /* Felles stil for store knapper i menyer */
        .big-btn { 
            width: 100%; 
            padding: 20px; 
            border-radius: 15px; 
            border: none; 
            font-size: 1.3rem; 
            font-weight: 800; 
            cursor: pointer;
            transition: transform 0.1s;
        }
        .big-btn:active { transform: scale(0.98); }
        
        .btn-primary { background: var(--accent); color: #fff; margin-top: 15px; }
        .btn-secondary { background: #1e293b; color: #94a3b8; border: 2px solid #334155; margin-top: 10px; }

        .opt-btn { background: #1e293b; border: 2px solid transparent; padding: 10px; border-radius: 10px; color: #94a3b8; font-weight: 700; font-size: 0.8rem; width: 100%; }
        .opt-btn.active { border-color: var(--primary); color: #fff; background: rgba(56, 189, 248, 0.1); }

        .hidden { display: none !important; }
        .shake { animation: shake 0.3s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-8px);} 75% {transform: translateX(8px);} }
    </style>
</head>
<body>

<div id="game-container">
    <div id="main-menu">
        <h1 style="font-size: 2.2rem; margin: 0;">Tidsmaskinen</h1>
        <p style="color: #64748b; font-size: 0.8rem; margin-bottom: 20px;">150+ Verb • Perfekt Layout</p>
        <div style="width:100%; text-align:left; font-size:0.7rem; font-weight:800; color:var(--primary); margin-bottom:5px;">FART</div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; width:100%; margin-bottom:15px;">
            <button class="opt-btn active" onclick="selectOpt(this, 'speed', 'rolig')">Rolig</button>
            <button class="opt-btn" onclick="selectOpt(this, 'speed', 'medium')">Medium</button>
            <button class="opt-btn" onclick="selectOpt(this, 'speed', 'hektisk')">Hektisk</button>
        </div>
        <div style="width:100%; text-align:left; font-size:0.7rem; font-weight:800; color:var(--primary); margin-bottom:5px;">TIDSFORM</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; margin-bottom:20px;">
            <button class="opt-btn active" onclick="selectOpt(this, 'tense', 'presens')">Presens</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'preteritum')">Preteritum</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'perfektum')">Perfektum</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'skal')">Fremtid</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'miks')" style="grid-column: span 2;">Miks Alle</button>
        </div>
        <button class="big-btn btn-primary" onclick="startGame()">START</button>
    </div>

    <div id="play-header" class="game-header hidden">
        <div onclick="goToMenu()" style="color: var(--primary); font-weight: 800; cursor:pointer;">AVSLUTT</div>
        <div class="stats-container">
            <span>LIV: <span id="lives" style="color:#fff">3</span></span>
            <span>POENG: <span id="score" style="color:#fff">0</span></span>
        </div>
    </div>

    <div id="play-content" class="hidden">
        <div id="timer-display" style="font-size: 1.5rem; color: var(--primary); font-weight: 800; height: 2rem;"></div>
        <div id="word-area">
            <span id="tense-tag">PRESENS</span>
            <div id="word-display">Å TA</div>
            <input type="text" id="user-input" readonly>
        </div>
    </div>

    <div id="kb-container" class="keyboard hidden">
        <div class="kb-row">
            <div class="key" onclick="press('q')">Q</div><div class="key" onclick="press('w')">W</div><div class="key" onclick="press('e')">E</div><div class="key" onclick="press('r')">R</div><div class="key" onclick="press('t')">T</div><div class="key" onclick="press('y')">Y</div><div class="key" onclick="press('u')">U</div><div class="key" onclick="press('i')">I</div><div class="key" onclick="press('o')">O</div><div class="key" onclick="press('p')">P</div><div class="key" onclick="press('å')">Å</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="press('a')">A</div><div class="key" onclick="press('s')">S</div><div class="key" onclick="press('d')">D</div><div class="key" onclick="press('f')">F</div><div class="key" onclick="press('g')">G</div><div class="key" onclick="press('h')">H</div><div class="key" onclick="press('j')">J</div><div class="key" onclick="press('k')">K</div><div class="key" onclick="press('l')">L</div><div class="key" onclick="press('ø')">Ø</div><div class="key" onclick="press('æ')">Æ</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="press('z')">Z</div><div class="key" onclick="press('x')">X</div><div class="key" onclick="press('c')">C</div><div class="key" onclick="press('v')">V</div><div class="key" onclick="press('b')">B</div><div class="key" onclick="press('n')">N</div><div class="key" onclick="press('m')">M</div>
            <div class="key del" onclick="press('Backspace')">DEL</div>
            <div class="key enter" onclick="press('Enter')">OK</div>
        </div>
        <div class="kb-row">
            <div class="key space" onclick="press(' ')">MELLOMROM</div>
        </div>
    </div>

    <div id="modal-overlay" class="hidden">
        <h2 style="font-size: 2.2rem; margin-bottom: 0;">Ferdig!</h2>
        <div style="font-size: 5rem; font-weight: 800; color:var(--primary);" id="final-score">0</div>
        <button class="big-btn btn-primary" onclick="startGame()">Spill igjen</button>
        <button class="big-btn btn-secondary" onclick="goToMenu()">Hovedmeny</button>
    </div>
</div>

<script>
    const VERBS = [
        {inf:'å ta', presens:'tar', preteritum:'tok', perfektum:'tatt', skal:'skal ta'},
        {inf:'å se', presens:'ser', preteritum:'så', perfektum:'sett', skal:'skal se'},
        {inf:'å gå', presens:'går', preteritum:'gikk', perfektum:'gått', skal:'skal gå'},
        {inf:'å vite', presens:'vet', preteritum:'visste', perfektum:'visst', skal:'skal vite'},
        {inf:'å være', presens:'er', preteritum:'var', perfektum:'vært', skal:'skal være'},
        {inf:'å ha', presens:'har', preteritum:'hadde', perfektum:'hatt', skal:'skal ha'}
        // ... (Legg til resten av verbene her)
    ];

    let score = 0, lives = 3, selectedSpeed = 'rolig', selectedTense = 'presens', currentTask = {}, timer, timeLeft, isPausing = false;
    const inputField = document.getElementById('user-input');

    function selectOpt(btn, type, val) {
        btn.parentNode.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(type === 'speed') selectedSpeed = val; else selectedTense = val;
    }

    function press(key) {
        if (isPausing) return;
        if (key === 'Backspace') {
            inputField.value = inputField.value.slice(0, -1);
        } else if (key === 'Enter') {
            checkAnswer();
        } else {
            if (inputField.value.length < 25) inputField.value += key;
        }
    }

    function checkAnswer() {
        if (!inputField.value || isPausing) return;
        clearInterval(timer);
        
        const val = inputField.value.toLowerCase().trim();
        if (val === currentTask.ans) {
            score++; updateStats();
            inputField.classList.add('correct-blink');
            isPausing = true;
            setTimeout(() => {
                isPausing = false;
                nextRound();
            }, 200);
        } else {
            lives--; updateStats();
            isPausing = true;
            document.getElementById('word-area').classList.add('shake');
            inputField.classList.add('wrong-feedback');
            inputField.value = currentTask.ans.toUpperCase();
            
            setTimeout(() => {
                document.getElementById('word-area').classList.remove('shake');
                inputField.classList.remove('wrong-feedback');
                if (lives <= 0) endGame();
                else { isPausing = false; nextRound(); }
            }, 800);
        }
    }

    function goToMenu() {
        clearInterval(timer);
        isPausing = false;
        document.getElementById('main-menu').classList.remove('hidden');
        document.getElementById('modal-overlay').classList.add('hidden');
        document.getElementById('play-header').classList.add('hidden');
        document.getElementById('play-content').classList.add('hidden');
        document.getElementById('kb-container').classList.add('hidden');
    }

    function startGame() {
        score = 0; lives = 3; isPausing = false;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('modal-overlay').classList.add('hidden');
        document.getElementById('play-header').classList.remove('hidden');
        document.getElementById('play-content').classList.remove('hidden');
        document.getElementById('kb-container').classList.remove('hidden');
        nextRound();
    }

    function nextRound() {
        const verb = VERBS[Math.floor(Math.random() * VERBS.length)];
        let tense = selectedTense;
        if (tense === 'miks') tense = ['presens', 'preteritum', 'perfektum', 'skal'][Math.floor(Math.random()*4)];
        currentTask = { inf: verb.inf, ans: verb[tense], tenseName: tense.toUpperCase() };
        document.getElementById('word-display').innerText = currentTask.inf.toUpperCase();
        document.getElementById('tense-tag').innerText = (currentTask.tenseName === 'SKAL') ? 'FREMTID' : currentTask.tenseName;
        inputField.value = '';
        inputField.classList.remove('correct-blink', 'wrong-feedback');
        if (selectedSpeed !== 'rolig') startTimer();
    }

    function startTimer() {
        timeLeft = (selectedSpeed === 'hektisk') ? 5 : 10;
        document.getElementById('timer-display').innerText = timeLeft + "s";
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = timeLeft + "s";
            if (timeLeft <= 0) { clearInterval(timer); checkAnswer(); }
        }, 1000);
    }

    function updateStats() {
        document.getElementById('score').innerText = score;
        document.getElementById('lives').innerText = lives;
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('final-score').innerText = score;
        document.getElementById('play-content').classList.add('hidden');
        document.getElementById('kb-container').classList.add('hidden');
        document.getElementById('modal-overlay').classList.remove('hidden');
    }
</script>
</body>
</html>
