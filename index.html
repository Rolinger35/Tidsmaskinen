<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tidsmaskinen Pro - Subtle Delete</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');

        :root {
            --bg: #0b0f1a;
            --card: #161e2d;
            --primary: #38bdf8;
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; margin: 0; overflow: hidden;
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        #game-container {
            background: var(--card);
            width: 100%; height: 100%; max-width: 500px;
            display: flex; flex-direction: column; position: relative;
            overflow: hidden;
        }

        /* SCREENS */
        #main-menu, #study-screen, #add-screen, #modal-overlay {
            position: absolute; inset: 0; z-index: 100;
            background: var(--bg); display: flex; flex-direction: column;
            padding: 20px; overflow-y: auto;
        }
        #main-menu { justify-content: center; align-items: center; }

        /* TABELL & SUBTIL SLETTING */
        #study-list-container {
            flex-grow: 1; overflow-y: auto; margin-top: 10px;
            border-radius: 10px; background: rgba(255,255,255,0.02);
        }
        .study-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .study-table th { position: sticky; top: 0; background: #1a202c; padding: 12px; text-align: left; color: var(--primary); font-size: 0.7rem; letter-spacing: 1px; }
        .study-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); color: #94a3b8; }
        
        .delete-btn {
            background: none;
            border: none;
            color: #475569; /* Veldig nøytral grå */
            cursor: pointer;
            font-size: 1rem;
            padding: 5px;
            transition: color 0.2s, transform 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .delete-btn:hover { color: var(--danger); }
        .delete-btn:active { transform: scale(0.9); }

        /* INPUTS */
        .search-box, .add-input { 
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #334155;
            background: #1e293b; color: #fff; outline: none; margin-bottom: 10px;
            font-family: inherit; font-size: 0.95rem;
        }
        .search-box:focus, .add-input:focus { border-color: var(--primary); }

        /* KNAPPER */
        .big-btn { width: 100%; padding: 18px; border-radius: 15px; border: none; font-size: 1.15rem; font-weight: 800; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        .big-btn:active { opacity: 0.8; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: #1e293b; color: #94a3b8; border: 2px solid #334155; }
        .btn-add { background: var(--success); color: #fff; }
        .btn-study { background: #0ea5e9; color: #fff; }

        .opt-btn { background: #1e293b; border: 2px solid transparent; padding: 10px; border-radius: 10px; color: #94a3b8; font-weight: 700; font-size: 0.8rem; width: 100%; transition: 0.2s; }
        .opt-btn.active { border-color: var(--primary); color: #fff; background: rgba(56, 189, 248, 0.1); }

        /* SPILLOMRÅDE */
        .game-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); }
        #play-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #word-display { font-size: 2.8rem; font-weight: 800; color: #fff; text-align: center; margin: 10px 0; }
        #tense-tag { background: var(--primary); color: #000; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        #user-input { width: 85%; padding: 10px; font-size: 1.8rem; border: none; border-bottom: 3px solid var(--primary); background: transparent; color: #fff; text-align: center; margin: 15px 0; outline: none; }

        /* TASTATUR */
        .keyboard { background: rgba(0,0,0,0.7); padding: 10px 8px calc(45px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; border-top: 1px solid rgba(255,255,255,0.1); }
        .kb-row { display: flex; justify-content: center; gap: 5px; }
        .key { background: #2d3748; color: #fff; flex: 1; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: 700; box-shadow: 0 3px 0 #1a202c; cursor: pointer; }
        .key:active { transform: translateY(2px); box-shadow: none; background: var(--primary); color: #000; }

        .hidden { display: none !important; }
        .wrong-feedback { border-bottom-color: var(--danger) !important; color: var(--danger) !important; }
        .correct-blink { border-bottom-color: var(--success) !important; color: var(--success) !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="main-menu">
        <h1 style="margin:0; font-size: 2.4rem;">Tidsmaskinen</h1>
        <p style="color:#64748b; font-size:0.85rem; margin-bottom:25px;">Din personlige verbtrener</p>
        
        <div style="width:100%; text-align:left; font-size:0.7rem; font-weight:800; color:var(--primary); margin-bottom:6px;">FART</div>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; width:100%; margin-bottom:18px;">
            <button class="opt-btn active" onclick="selectOpt(this, 'speed', 'rolig')">Rolig</button>
            <button class="opt-btn" onclick="selectOpt(this, 'speed', 'medium')">Medium</button>
            <button class="opt-btn" onclick="selectOpt(this, 'speed', 'hektisk')">Hektisk</button>
        </div>

        <div style="width:100%; text-align:left; font-size:0.7rem; font-weight:800; color:var(--primary); margin-bottom:6px;">TIDSFORM</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; margin-bottom:25px;">
            <button class="opt-btn active" onclick="selectOpt(this, 'tense', 'presens')">Presens</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'preteritum')">Preteritum</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'perfektum')">Perfektum</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'skal')">Fremtid</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'miks')" style="grid-column: span 2;">Miks Alle</button>
        </div>

        <button class="big-btn btn-primary" onclick="startGame()">START SPILLET</button>
        <button class="big-btn btn-study" onclick="openStudy()">📖 MINE VERB</button>
        <button class="big-btn btn-add" onclick="openAdd()">➕ LEGG TIL NYTT</button>
    </div>

    <div id="add-screen" class="hidden">
        <h2 style="margin-top:0">Nytt verb</h2>
        <input type="text" id="newInf" class="add-input" placeholder="Infinitiv (f.eks: å se)">
        <input type="text" id="newPres" class="add-input" placeholder="Presens (ser)">
        <input type="text" id="newPret" class="add-input" placeholder="Preteritum (så)">
        <input type="text" id="newPerf" class="add-input" placeholder="Perfektum (sett)">
        <input type="text" id="newFut" class="add-input" placeholder="Fremtid (skal se)">
        <button class="big-btn btn-add" onclick="saveNewVerb()">LAGRE</button>
        <button class="big-btn btn-secondary" onclick="closeAdd()">AVBRYT</button>
    </div>

    <div id="study-screen" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
            <h2 style="margin:0">Mine verb</h2>
            <button onclick="closeStudy()" style="background:none; border:none; color:var(--primary); font-weight:800; cursor:pointer;">LUKK</button>
        </div>
        <input type="text" id="verbSearch" class="search-box" placeholder="Søk i listen..." onkeyup="filterVerbs()">
        <div id="study-list-container">
            <table class="study-table">
                <thead><tr><th>INFINITIV</th><th>PRESENS</th><th>PRET.</th><th style="width:40px;"></th></tr></thead>
                <tbody id="verbTableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="play-header" class="game-header hidden">
        <div onclick="location.reload()" style="color:var(--primary); font-weight:800; cursor:pointer; font-size: 0.8rem;">MENY</div>
        <div class="stats-container">
            <span>LIV: <span id="lives" style="color:#fff">3</span></span>
            <span>POENG: <span id="score" style="color:#fff">0</span></span>
        </div>
    </div>
    <div id="play-content" class="hidden">
        <div id="timer-display" style="color:var(--primary); font-weight:800; height:1.5rem; font-size: 1.2rem;"></div>
        <span id="tense-tag"></span>
        <div id="word-display"></div>
        <input type="text" id="user-input" readonly>
    </div>

    <div id="kb-container" class="keyboard hidden">
        <div class="kb-row"><div class="key" onclick="press('q')">Q</div><div class="key" onclick="press('w')">W</div><div class="key" onclick="press('e')">E</div><div class="key" onclick="press('r')">R</div><div class="key" onclick="press('t')">T</div><div class="key" onclick="press('y')">Y</div><div class="key" onclick="press('u')">U</div><div class="key" onclick="press('i')">I</div><div class="key" onclick="press('o')">O</div><div class="key" onclick="press('p')">P</div><div class="key" onclick="press('å')">Å</div></div>
        <div class="kb-row"><div class="key" onclick="press('a')">A</div><div class="key" onclick="press('s')">S</div><div class="key" onclick="press('d')">D</div><div class="key" onclick="press('f')">F</div><div class="key" onclick="press('g')">G</div><div class="key" onclick="press('h')">H</div><div class="key" onclick="press('j')">J</div><div class="key" onclick="press('k')">K</div><div class="key" onclick="press('l')">L</div><div class="key" onclick="press('ø')">Ø</div><div class="key" onclick="press('æ')">Æ</div></div>
        <div class="kb-row"><div class="key" onclick="press('z')">Z</div><div class="key" onclick="press('x')">X</div><div class="key" onclick="press('c')">C</div><div class="key" onclick="press('v')">V</div><div class="key" onclick="press('b')">B</div><div class="key" onclick="press('n')">N</div><div class="key" onclick="press('m')">M</div><div class="key" style="background:#4a5568;" onclick="press('Backspace')">⌫</div><div class="key" style="background:var(--accent);" onclick="press('Enter')">OK</div></div>
        <div class="kb-row"><div class="key" style="flex:4; background:#334155; font-size: 0.8rem;" onclick="press(' ')">MELLOMROM</div></div>
    </div>

    <div id="modal-overlay" class="hidden">
        <h2 style="margin-bottom:0">Spillet er slutt</h2>
        <div id="final-score" style="font-size:5rem; color:var(--primary); font-weight:800; line-height: 1;">0</div>
        <p style="color: #64748b; margin-bottom: 20px;">poeng oppnådd</p>
        <button class="big-btn btn-primary" onclick="startGame()">SPILL IGJEN</button>
        <button class="big-btn btn-secondary" onclick="location.reload()">TIL MENYEN</button>
    </div>
</div>

<script>
    const defaultVerbs = [
        {inf:'å ta', presens:'tar', preteritum:'tok', perfektum:'tatt', skal:'skal ta'},
        {inf:'å se', presens:'ser', preteritum:'så', perfektum:'sett', skal:'skal se'},
        {inf:'å gå', presens:'går', preteritum:'gikk', perfektum:'gått', skal:'skal gå'},
        {inf:'å være', presens:'er', preteritum:'var', perfektum:'vært', skal:'skal være'}
    ];

    let VERBS = [];
    let score = 0, lives = 3, selectedSpeed = 'rolig', selectedTense = 'presens', currentTask = {}, timer, timeLeft, isPausing = false;

    function initVerbs() {
        const saved = localStorage.getItem('myVerbs');
        VERBS = saved ? JSON.parse(saved) : [...defaultVerbs];
        if (!saved) localStorage.setItem('myVerbs', JSON.stringify(VERBS));
    }

    function saveNewVerb() {
        const getVal = id => document.getElementById(id).value.trim().toLowerCase();
        const v = { inf: getVal('newInf'), presens: getVal('newPres'), preteritum: getVal('newPret'), perfektum: getVal('newPerf'), skal: getVal('newFut') };
        if (!v.inf || !v.presens || !v.preteritum || !v.perfektum || !v.skal) return;
        VERBS.push(v);
        localStorage.setItem('myVerbs', JSON.stringify(VERBS));
        ['newInf','newPres','newPret','newPerf','newFut'].forEach(id => document.getElementById(id).value = '');
        closeAdd();
    }

    function deleteVerb(index) {
        if(confirm("Slette verbet?")) {
            VERBS.splice(index, 1);
            localStorage.setItem('myVerbs', JSON.stringify(VERBS));
            openStudy();
        }
    }

    function openAdd() { document.getElementById('add-screen').classList.remove('hidden'); }
    function closeAdd() { document.getElementById('add-screen').classList.add('hidden'); }
    function openStudy() { 
        const tbody = document.getElementById('verbTableBody');
        tbody.innerHTML = VERBS.map((v, i) => `
            <tr>
                <td style="font-weight:700; color:white">${v.inf}</td>
                <td>${v.presens}</td>
                <td>${v.preteritum}</td>
                <td><button class="delete-btn" onclick="deleteVerb(${i})">✕</button></td>
            </tr>
        `).join('');
        document.getElementById('study-screen').classList.remove('hidden'); 
    }
    function closeStudy() { document.getElementById('study-screen').classList.add('hidden'); }

    function selectOpt(btn, type, val) {
        btn.parentNode.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(type === 'speed') selectedSpeed = val; else selectedTense = val;
    }

    function press(key) {
        if (isPausing) return;
        const input = document.getElementById('user-input');
        if (key === 'Backspace') input.value = input.value.slice(0, -1);
        else if (key === 'Enter') checkAnswer();
        else if (input.value.length < 25) input.value += key;
    }

    function checkAnswer() {
        const input = document.getElementById('user-input');
        if (!input.value || isPausing) return;
        clearInterval(timer);
        const val = input.value.toLowerCase().trim();
        if (val === currentTask.ans) {
            score++; updateStats();
            input.classList.add('correct-blink');
            isPausing = true;
            setTimeout(() => { isPausing = false; nextRound(); }, 200);
        } else {
            lives--; updateStats();
            isPausing = true;
            input.classList.add('wrong-feedback');
            input.value = currentTask.ans.toUpperCase();
            setTimeout(() => {
                input.classList.remove('wrong-feedback');
                if (lives <= 0) endGame();
                else { isPausing = false; nextRound(); }
            }, 800);
        }
    }

    function startGame() {
        if (VERBS.length === 0) return alert("Legg til verb først!");
        score = 0; lives = 3;
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('modal-overlay').classList.add('hidden');
        document.getElementById('play-header').classList.remove('hidden');
        document.getElementById('play-content').classList.remove('hidden');
        document.getElementById('kb-container').classList.remove('hidden');
        nextRound();
    }

    function nextRound() {
        const verb = VERBS[Math.floor(Math.random() * VERBS.length)];
        let tense = selectedTense;
        if (tense === 'miks') tense = ['presens', 'preteritum', 'perfektum', 'skal'][Math.floor(Math.random()*4)];
        currentTask = { inf: verb.inf, ans: verb[tense], tenseName: tense.toUpperCase() };
        document.getElementById('word-display').innerText = currentTask.inf.toUpperCase();
        document.getElementById('tense-tag').innerText = (currentTask.tenseName === 'SKAL') ? 'FREMTID' : currentTask.tenseName;
        document.getElementById('user-input').value = '';
        document.getElementById('user-input').classList.remove('correct-blink');
        if (selectedSpeed !== 'rolig') startTimer();
    }

    function startTimer() {
        timeLeft = (selectedSpeed === 'hektisk') ? 5 : 10;
        document.getElementById('timer-display').innerText = timeLeft + "s";
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = timeLeft + "s";
            if (timeLeft <= 0) { clearInterval(timer); checkAnswer(); }
        }, 1000);
    }

    function updateStats() {
        document.getElementById('score').innerText = score;
        document.getElementById('lives').innerText = lives;
    }

    function endGame() {
        document.getElementById('final-score').innerText = score;
        document.getElementById('play-content').classList.add('hidden');
        document.getElementById('kb-container').classList.add('hidden');
        document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function filterVerbs() {
        const q = document.getElementById('verbSearch').value.toLowerCase();
        const rows = document.getElementById('verbTableBody').getElementsByTagName('tr');
        for (let r of rows) r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
    }

    initVerbs();
</script>
</body>
</html>
