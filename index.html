<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tidsmaskinen Pro - Mobil Fix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');

        :root {
            --bg: #0b0f1a;
            --card: #161e2d;
            --primary: #38bdf8;
            --accent: #3b82f6;
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
            /* Sikrer at bakgrunnen dekker hele skjermen inkludert notch/bunn */
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        #game-container {
            background: var(--card);
            width: 100%; height: 100%; max-width: 500px;
            display: flex; flex-direction: column; position: relative;
            /* Hindrer at innholdet "lekker" ut */
            overflow: hidden; 
        }

        /* HEADER */
        .game-header { padding: 1rem; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); flex-shrink: 0; }
        .stats-container { display: flex; gap: 15px; font-weight: 700; color: #94a3b8; font-size: 0.85rem; }
        
        /* SPILLOMRÅDE */
        #play-content { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 1rem;
            min-height: 0; /* Viktig for flex-containere */
        }
        
        #word-display { font-size: 2.5rem; font-weight: 800; margin: 0.5rem 0; color: #fff; text-align: center; }
        #tense-tag { background: var(--primary); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; }
        
        #user-input { 
            width: 85%; padding: 8px; font-size: 1.5rem; border: none; 
            border-bottom: 3px solid var(--primary); background: transparent; 
            color: #fff; text-align: center; margin: 1rem 0; outline: none;
        }

        /* DET FIKSEDE TASTATURET */
        .keyboard { 
            background: rgba(0,0,0,0.5); 
            /* Bruker env(safe-area-inset-bottom) for iPhone/Android bar */
            padding: 12px 6px calc(15px + env(safe-area-inset-bottom)); 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            flex-shrink: 0; /* Hindrer at tastaturet blir mindre når innholdet vokser */
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .kb-row { display: flex; justify-content: center; gap: 4px; width: 100%; }
        
        .key { 
            background: #2d3748; color: #fff; flex: 1; height: 48px; 
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 1rem;
            box-shadow: 0 3px 0 #1a202c;
            user-select: none;
        }
        .key:active { transform: translateY(2px); box-shadow: none; background: var(--primary); color: #000; }
        
        .key.del { background: #4a5568; flex: 1.4; }
        .key.enter { background: var(--accent); flex: 1.6; }
        .key.space { flex: 4; background: #334155; margin-top: 4px; height: 50px; }

        /* MENYER */
        #main-menu, #modal-overlay {
            position: absolute; inset: 0; z-index: 100;
            background: var(--bg); display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 2rem;
            text-align: center;
        }
        .section-label { font-size: 0.7rem; font-weight: 800; color: var(--primary); text-transform: uppercase; margin: 12px 0 6px 0; align-self: flex-start; }
        .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
        .opt-btn { background: #1e293b; border: 2px solid transparent; padding: 10px 4px; border-radius: 10px; color: #94a3b8; font-weight: 700; font-size: 0.75rem; }
        .opt-btn.active { border-color: var(--primary); color: #fff; background: rgba(56, 189, 248, 0.1); }
        .start-btn { width: 100%; padding: 18px; border-radius: 15px; border: none; background: var(--accent); color: #fff; font-size: 1.2rem; font-weight: 800; margin-top: 15px; }

        .hidden { display: none !important; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-8px);} 75% {transform: translateX(8px);} }
    </style>
</head>
<body>

<div id="game-container">
    <div id="main-menu">
        <h1 style="font-size: 2rem; margin: 0;">Tidsmaskinen</h1>
        <p style="color: #64748b; font-size: 0.8rem; margin-bottom: 1rem;">Lær 150+ verb</p>
        
        <div class="section-label">Fart</div>
        <div class="option-grid">
            <button class="opt-btn active" onclick="selectOpt(this, 'speed', 'rolig')">Rolig</button>
            <button class="opt-btn" onclick="selectOpt(this, 'speed', 'medium')">Medium</button>
            <button class="opt-btn" onclick="selectOpt(this, 'speed', 'hektisk')">Hektisk</button>
        </div>

        <div class="section-label">Tidsform</div>
        <div class="option-grid" style="grid-template-columns: 1fr 1fr;">
            <button class="opt-btn active" onclick="selectOpt(this, 'tense', 'presens')">Presens</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'preteritum')">Preteritum</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'perfektum')">Perfektum</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'skal')">Fremtid</button>
            <button class="opt-btn" onclick="selectOpt(this, 'tense', 'miks')" style="grid-column: span 2;">Miks alle</button>
        </div>
        <button class="start-btn" onclick="startGame()">START</button>
    </div>

    <div id="play-header" class="game-header hidden">
        <div onclick="location.reload()" style="color: var(--primary); font-weight: 800;">AVSLUTT</div>
        <div class="stats-container">
            <span>LIV: <span id="lives" style="color:#fff">3</span></span>
            <span>POENG: <span id="score" style="color:#fff">0</span></span>
        </div>
    </div>

    <div id="play-content" class="hidden">
        <div id="timer-display" style="font-size: 1.4rem; color: var(--primary); font-weight: 800; height: 1.8rem;"></div>
        <span id="tense-tag">PRESENS</span>
        <div id="word-display">Å TA</div>
        <input type="text" id="user-input" readonly placeholder="...">
    </div>

    <div id="kb-container" class="keyboard hidden">
        <div class="kb-row">
            <div class="key" onclick="press('q')">Q</div><div class="key" onclick="press('w')">W</div><div class="key" onclick="press('e')">E</div><div class="key" onclick="press('r')">R</div><div class="key" onclick="press('t')">T</div><div class="key" onclick="press('y')">Y</div><div class="key" onclick="press('u')">U</div><div class="key" onclick="press('i')">I</div><div class="key" onclick="press('o')">O</div><div class="key" onclick="press('p')">P</div><div class="key" onclick="press('å')">Å</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="press('a')">A</div><div class="key" onclick="press('s')">S</div><div class="key" onclick="press('d')">D</div><div class="key" onclick="press('f')">F</div><div class="key" onclick="press('g')">G</div><div class="key" onclick="press('h')">H</div><div class="key" onclick="press('j')">J</div><div class="key" onclick="press('k')">K</div><div class="key" onclick="press('l')">L</div><div class="key" onclick="press('ø')">Ø</div><div class="key" onclick="press('æ')">Æ</div>
        </div>
        <div class="kb-row">
            <div class="key" onclick="press('z')">Z</div><div class="key" onclick="press('x')">X</div><div class="key" onclick="press('c')">C</div><div class="key" onclick="press('v')">V</div><div class="key" onclick="press('b')">B</div><div class="key" onclick="press('n')">N</div><div class="key" onclick="press('m')">M</div>
            <div class="key del" onclick="press('Backspace')">DEL</div>
            <div class="key enter" onclick="press('Enter')">OK</div>
        </div>
        <div class="kb-row">
            <div class="key space" onclick="press(' ')">MELLOMROM</div>
        </div>
    </div>

    <div id="modal-overlay" class="hidden">
        <h2>Ferdig!</h2>
        <div style="font-size: 4rem; font-weight: 800; color:var(--primary);" id="final-score">0</div>
        <button class="start-btn" onclick="startGame()">Spill igjen</button>
    </div>
</div>

<script>
    // Forkortet liste for eksempel, men du kan beholde alle 150 verbene dine her
    const VERBS = [
        {inf:'å ta', presens:'tar', preteritum:'tok', perfektum:'tatt', skal:'skal ta'},
        {inf:'å se', presens:'ser', preteritum:'så', perfektum:'sett', skal:'skal se'},
        {inf:'å gå', presens:'går', preteritum:'gikk', perfektum:'gått', skal:'skal gå'},
        {inf:'å være', presens:'er', preteritum:'var', perfektum:'vært', skal:'skal være'},
        {inf:'å gjøre', presens:'gjør', preteritum:'gjorde', perfektum:'gjort', skal:'skal gjøre'}
        // ... legg til de 150 andre her ...
    ];

    let score = 0, lives = 3, selectedSpeed = 'rolig', selectedTense = 'presens', currentTask = {}, timer, timeLeft;
    const inputField = document.getElementById('user-input');

    function selectOpt(btn, type, val) {
        btn.parentNode.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(type === 'speed') selectedSpeed = val; else selectedTense = val;
    }

    function press(key) {
        if (key === 'Backspace') {
            inputField.value = inputField.value.slice(0, -1);
        } else if (key === 'Enter') {
            checkAnswer();
        } else {
            if (inputField.value.length < 20) inputField.value += key;
        }
    }

    function checkAnswer() {
        if (!inputField.value) return;
        if (inputField.value.toLowerCase().trim() === currentTask.ans) {
            score++; updateStats(); nextRound();
        } else {
            lives--; updateStats();
            document.getElementById('game-container').classList.add('shake');
            setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 400);
            if (lives <= 0) { clearInterval(timer); endGame(); }
            else { alert("Feil! Riktig: " + currentTask.ans.toUpperCase()); nextRound(); }
        }
    }

    function startGame() {
        score = 0; lives = 3; updateStats();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('modal-overlay').classList.add('hidden');
        document.getElementById('play-header').classList.remove('hidden');
        document.getElementById('play-content').classList.remove('hidden');
        document.getElementById('kb-container').classList.remove('hidden');
        nextRound();
    }

    function nextRound() {
        clearInterval(timer);
        const verb = VERBS[Math.floor(Math.random() * VERBS.length)];
        let tense = selectedTense;
        if (tense === 'miks') tense = ['presens', 'preteritum', 'perfektum', 'skal'][Math.floor(Math.random()*4)];
        currentTask = { inf: verb.inf, ans: verb[tense], tenseName: tense.toUpperCase() };
        document.getElementById('word-display').innerText = currentTask.inf.toUpperCase();
        document.getElementById('tense-tag').innerText = (currentTask.tenseName === 'SKAL') ? 'FREMTID' : currentTask.tenseName;
        inputField.value = '';
        if (selectedSpeed !== 'rolig') startTimer();
    }

    function startTimer() {
        timeLeft = (selectedSpeed === 'hektisk') ? 5 : 10;
        document.getElementById('timer-display').innerText = timeLeft + "s";
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = timeLeft + "s";
            if (timeLeft <= 0) { clearInterval(timer); checkAnswer(); }
        }, 1000);
    }

    function updateStats() {
        document.getElementById('score').innerText = score;
        document.getElementById('lives').innerText = lives;
    }

    function endGame() {
        document.getElementById('final-score').innerText = score;
        document.getElementById('modal-overlay').classList.remove('hidden');
    }
</script>
</body>
</html>
